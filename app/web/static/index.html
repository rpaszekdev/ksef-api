<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ksef-api — playground</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #131a32;
    --border: #24304f;
    --text: #e6ebf5;
    --muted: #94a3b8;
    --accent: #5b8cff;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    background: rgba(11, 16, 32, 0.9);
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.2px; }
  header .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #1e293b; color: var(--muted); }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 {
    font-size: 13px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 12px;
    letter-spacing: 0.5px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  label { font-size: 12px; color: var(--muted); }
  input, select {
    background: #0b1020;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font: inherit;
    min-width: 0;
    flex: 1;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button {
    background: var(--accent);
    border: 0;
    color: white;
    padding: 7px 14px;
    border-radius: 6px;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  button.ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  button.danger { background: var(--err); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:hover:not(:disabled) { filter: brightness(1.1); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .log {
    background: #050816;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font: 12px/1.55 var(--mono);
    max-height: 480px;
    overflow: auto;
    white-space: pre;
  }
  .log .req { color: var(--accent); }
  .log .ok { color: var(--ok); }
  .log .err { color: var(--err); }
  .log .dim { color: var(--muted); }
  .kbd {
    font-family: var(--mono);
    font-size: 11px;
    background: #0b1020;
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
  }
  .key-preview {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ok);
  }
  hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
  .hint { color: var(--muted); font-size: 12px; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>ksef-api playground</h1>
  <span class="badge" id="healthBadge">…</span>
  <span class="hint" style="margin-left:auto">
    Swagger UI: <a href="/docs" style="color: var(--accent)">/docs</a>
  </span>
</header>

<main>
  <!-- connection -->
  <section class="panel">
    <h2>Connection</h2>
    <div class="row">
      <label style="flex-basis: 100%">Base URL</label>
      <input id="baseUrl" value="" />
    </div>
    <div class="row">
      <label style="flex-basis: 100%">X-API-Key (saved in localStorage)</label>
      <input id="apiKey" placeholder="ksef_..." />
      <button class="ghost" onclick="clearKey()">Clear</button>
    </div>
    <div class="hint" id="keyPreview"></div>
  </section>

  <!-- signup -->
  <section class="panel">
    <h2>1 · Signup biuro (public)</h2>
    <div class="row grid2">
      <input id="suEmail" placeholder="email" value="biuro@test.pl" />
      <input id="suPassword" placeholder="password (≥8 chars)" value="secret12345" />
    </div>
    <div class="row">
      <input id="suCompany" placeholder="company name" value="Testowe Biuro" />
      <button onclick="signup()">POST /v1/tenants/signup</button>
    </div>
    <div class="hint">The response <b>key</b> is auto-stored as your API key.</div>
  </section>

  <!-- me -->
  <section class="panel">
    <h2>2 · Whoami</h2>
    <div class="row"><button onclick="me()">GET /v1/tenants/me</button></div>
  </section>

  <!-- clients -->
  <section class="panel">
    <h2>3 · Managed clients (NIPs)</h2>
    <div class="row">
      <input id="cNip" placeholder="10-digit NIP" value="5252344078" maxlength="10" />
      <input id="cName" placeholder="display name" value="Klient Testowy" />
    </div>
    <div class="row">
      <button onclick="addClient()">POST /v1/clients</button>
      <button class="ghost" onclick="listClients()">GET /v1/clients</button>
      <button class="danger" onclick="deleteClient()">DELETE /v1/clients/{nip}</button>
    </div>
  </section>

  <!-- invoices -->
  <section class="panel">
    <h2>4 · Invoices</h2>
    <div class="row grid2">
      <input id="iSellerNip" placeholder="seller NIP (must be managed)" value="5252344078" />
      <input id="iBuyerNip" placeholder="buyer NIP" value="9999999999" />
    </div>
    <div class="row grid2">
      <input id="iItemName" placeholder="item name" value="Usługa księgowa" />
      <input id="iItemPrice" type="number" placeholder="net price" value="500" />
    </div>
    <div class="row">
      <button onclick="createInvoice()">POST /v1/invoices</button>
      <button class="ghost" onclick="listInvoices()">GET /v1/invoices</button>
    </div>
    <div class="hint">
      Invoice stays <span class="kbd">pending</span> until KSeF integration lands in Week&nbsp;1 Day&nbsp;5–7.
    </div>
  </section>

  <!-- health + response -->
  <section class="panel" style="grid-column: 1 / -1">
    <h2>Response log</h2>
    <div class="row" style="margin-bottom: 8px">
      <button class="ghost" onclick="health()">GET /v1/health</button>
      <button class="ghost" onclick="status()">GET /v1/status</button>
      <button class="ghost" onclick="clearLog()" style="margin-left:auto">Clear log</button>
    </div>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
  const logEl = document.getElementById("log");
  const keyEl = document.getElementById("apiKey");
  const baseEl = document.getElementById("baseUrl");
  const keyPrev = document.getElementById("keyPreview");

  baseEl.value = localStorage.getItem("ksef_base") || window.location.origin;
  keyEl.value = localStorage.getItem("ksef_key") || "";
  updateKeyPreview();

  baseEl.addEventListener("change", () => localStorage.setItem("ksef_base", baseEl.value));
  keyEl.addEventListener("change", () => {
    localStorage.setItem("ksef_key", keyEl.value);
    updateKeyPreview();
  });

  function updateKeyPreview() {
    const k = keyEl.value;
    keyPrev.innerHTML = k ? `<span class="key-preview">${k.slice(0,12)}…</span> (${k.length} chars)` : `<span class="dim">no key set</span>`;
  }

  function clearKey() {
    keyEl.value = "";
    localStorage.removeItem("ksef_key");
    updateKeyPreview();
  }

  function clearLog() { logEl.textContent = ""; }

  function log(line, cls = "") {
    const span = document.createElement("span");
    span.className = cls;
    span.textContent = line + "\n";
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
  }

  async function call(method, path, body) {
    const base = baseEl.value.replace(/\/$/, "");
    const headers = { "Content-Type": "application/json" };
    if (keyEl.value) headers["X-API-Key"] = keyEl.value;
    log(`→ ${method} ${path}`, "req");
    try {
      const resp = await fetch(base + path, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
      });
      const text = await resp.text();
      let pretty = text;
      try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch {}
      const cls = resp.ok ? "ok" : "err";
      log(`← ${resp.status} ${resp.statusText}`, cls);
      log(pretty, "dim");
      log("");
      return { status: resp.status, ok: resp.ok, body: pretty };
    } catch (e) {
      log(`✗ network error: ${e.message}`, "err");
      return { status: 0, ok: false, body: e.message };
    }
  }

  // --- actions ---
  async function health()  { await call("GET", "/v1/health"); pollHealth(); }
  async function status()  { await call("GET", "/v1/status"); }
  async function me()      { await call("GET", "/v1/tenants/me"); }

  async function signup() {
    const body = {
      email: document.getElementById("suEmail").value,
      password: document.getElementById("suPassword").value,
      company_name: document.getElementById("suCompany").value || null,
    };
    const r = await call("POST", "/v1/tenants/signup", body);
    try {
      const j = JSON.parse(r.body);
      if (j.key) {
        keyEl.value = j.key;
        localStorage.setItem("ksef_key", j.key);
        updateKeyPreview();
        log(`✓ API key saved for future calls`, "ok");
      }
    } catch {}
  }

  async function addClient() {
    await call("POST", "/v1/clients", {
      nip: document.getElementById("cNip").value,
      display_name: document.getElementById("cName").value || null,
    });
  }

  async function listClients() { await call("GET", "/v1/clients"); }

  async function deleteClient() {
    const nip = document.getElementById("cNip").value;
    if (!confirm(`Delete client NIP ${nip}?`)) return;
    await call("DELETE", `/v1/clients/${nip}`);
  }

  async function createInvoice() {
    const body = {
      seller_nip: document.getElementById("iSellerNip").value,
      buyer: {
        nip: document.getElementById("iBuyerNip").value,
        name: "Kontrahent Testowy",
      },
      items: [{
        name: document.getElementById("iItemName").value,
        quantity: 1,
        unit_price_net: Number(document.getElementById("iItemPrice").value),
        vat_rate: 23,
      }],
      issue_date: new Date().toISOString(),
      currency: "PLN",
    };
    await call("POST", "/v1/invoices", body);
  }

  async function listInvoices() { await call("GET", "/v1/invoices"); }

  // health badge
  async function pollHealth() {
    const badge = document.getElementById("healthBadge");
    try {
      const r = await fetch(baseEl.value + "/v1/health");
      if (r.ok) {
        const j = await r.json();
        badge.textContent = `● ${j.status} • v${j.version}`;
        badge.style.color = "var(--ok)";
      } else throw 0;
    } catch {
      badge.textContent = "● offline";
      badge.style.color = "var(--err)";
    }
  }
  pollHealth();
</script>
</body>
</html>
