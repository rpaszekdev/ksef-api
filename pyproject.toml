[project]
name = "ksef-api"
version = "0.1.0"
description = "Multi-tenant KSeF API wrapper for Polish biura rachunkowe"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Robert Paszek" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "cryptography>=43.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "stripe>=11.0",
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.15",
  # KSeF protocol — installed lazily in integration tests for now
  # "ksef-client>=0.3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.12",
  "types-redis",
  "types-python-jose",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# B008 — FastAPI idiom: Depends() in arg defaults
# N811 — SQLAlchemy idiom: `from ... import UUID as PgUUID`
ignore = ["B008", "N811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
